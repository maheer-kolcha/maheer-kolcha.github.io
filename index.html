<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KML KMZ Viewer & Editor</title>


<!-- Leaflet -->
<link rel="stylesheet" href="libs/leaflet.css">


<!-- Application CSS -->
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/toolbar.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/statusbar.css">

<link rel="stylesheet" href="css/jquery.terminal.min.css" />
<script src="jquery.terminal.js"></script>

<style>
  /* The floating, draggable window container */
  #movable-terminal-window {
    display: none; /* Hidden by default until shortcut is pressed */
    position: fixed;
    top: 20%;
    left: 30%;
    width: 550px;
    height: 380px;
    background-color: #1e1e1e;
    border: 1px solid #444;
    border-radius: 6px;
    box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 99999; /* Keeps window above all other web content */
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* The top handle bar used for dragging the window */
  #terminal-header-handle {
    padding: 8px 12px;
    cursor: move; /* Changes cursor to dragging arrows */
    background-color: #2d2d2d;
    color: #ccc;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #444;
    user-select: none;
  }

  /* Decorative window buttons */
  .window-buttons {
    display: flex;
    gap: 6px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-close { background-color: #ff5f56; cursor: pointer; }
  .dot-min { background-color: #ffbd2e; }
  .dot-max { background-color: #27c93f; }

  /* Inner area housing the actual xterm window */
  #terminal-body-container {
    width: 100%;
    height: calc(100% - 35px); /* Subtracts header bar height */
    background-color: #000;
    padding: 5px;
    box-sizing: border-box;
  }
</style>
</head>


<body>


    <!-- Toolbar -->

    <div id="toolbar">


        <button id="btnOpen">
            Open
        </button>


        <button id="btnSave">
            Save KML
        </button>


        <button id="btnSaveKMZ">
            Save KMZ
        </button>


        <div class="separator"></div>


        <button id="btnUndo">
            Undo
        </button>


        <button id="btnRedo">
            Redo
        </button>



        <input

        id="fileInput"

        type="file"

        accept=".kml,.kmz"

        hidden>


    </div>





    <!-- Main workspace -->

    <div id="workspace">



        <!-- Left sidebar -->

        <aside id="sidebar">



            <div class="panel">


                <h3>
                    Layers
                </h3>


                <div id="layerList">

                    No layers

                </div>


            </div>



        </aside>





        <!-- Map -->

        <main id="map">


        </main>





        <!-- Right properties -->

        <aside id="properties">



            <div class="panel">


                <h3>
                    Properties
                </h3>


                <div id="propertyPanel">

                    No selection

                </div>


            </div>





            <div class="panel">


                <h3>
                    Style
                </h3>


                <div id="stylePanel">


                    No selection


                </div>


            </div>



        </aside>



    </div>






    <!-- Status bar -->

    <footer id="statusbar">


        <span id="statusMessage">
            Ready
        </span>


        <span id="coordinates">
        </span>


    </footer>



</div>





<!-- Leaflet -->

<script src="libs/leaflet.js"></script>

<!-- ZIP library for KMZ -->
<script src="libs/fflate.min.js"></script>


<!-- Application -->
<script type="module" src="js/main.js"></script>

<div id="dev-terminal-window" style="display: none; position: fixed; top: 15%; left: 25%; width: 600px; height: 400px; background: #111; border: 1px solid #444; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); z-index: 999999; font-family: monospace; border-radius: 6px; overflow: hidden; box-sizing: border-box;">
    
    <!-- Title Bar Handle for Dragging -->
    <div class="term-header" style="background: #222; color: #bbb; padding: 8px 12px; cursor: move; user-select: none; border-bottom: 1px solid #333; font-size: 13px; display: flex; justify-content: space-between; align-items: center;">
        <span>DevConsole:~</span>
        <button class="term-close-btn" style="background: #ff5f56; border: none; width: 12px; height: 12px; border-radius: 50%; cursor: pointer;" title="Close"></button>
    </div>
    
    <!-- Core Terminal Target Area -->
    <div id="dev-terminal-body" style="height: calc(100% - 32px); width: 100%;"></div>
</div>


</body>

</html>
